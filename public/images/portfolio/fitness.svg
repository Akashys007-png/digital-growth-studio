<svg width="400" height="260" viewBox="0 0 400 260" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="fBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>
  </defs>

  <rect width="400" height="260" fill="url(#fBg)" />

  <!-- motion lines -->
  <g stroke="#ffffff" stroke-opacity="0.25" stroke-width="6" stroke-linecap="round">
    <line x1="40" y1="90" x2="110" y2="90" />
    <line x1="30" y1="115" x2="120" y2="115" />
    <line x1="50" y1="140" x2="100" y2="140" />
  </g>

  <!-- dumbbell -->
  <g transform="translate(200,130) rotate(-10)">
    <rect x="-90" y="-16" width="180" height="32" rx="8" fill="#ffffff" />
    <rect x="-120" y="-34" width="30" height="68" rx="8" fill="#ffffff" />
    <rect x="90" y="-34" width="30" height="68" rx="8" fill="#ffffff" />
    <rect x="-132" y="-22" width="14" height="44" rx="6" fill="#ffffff" opacity="0.8" />
    <rect x="118" y="-22" width="14" height="44" rx="6" fill="#ffffff" opacity="0.8" />
  </g>

  <!-- flame -->
  <g transform="translate(300,80)">
    <path d="M0 -30 c14 14 20 26 12 42 c-4 8 -14 12 -22 8 c6 0 10 -6 8 -12
             c-2 6 -10 8 -16 4 c-8 -6 -8 -18 0 -28 c2 8 8 10 10 4
             c-4 -8 2 -14 8 -18 z"
          fill="#fbbf24" />
  </g>
</svg>
