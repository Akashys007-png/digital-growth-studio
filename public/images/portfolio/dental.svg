  </defs>

  <rect width="400" height="260" fill="url(#dBg)" />

  <circle cx="90" cy="60" r="60" fill="#ffffff" opacity="0.08" />
  <circle cx="330" cy="210" r="70" fill="#ffffff" opacity="0.06" />

  <!-- tooth -->
