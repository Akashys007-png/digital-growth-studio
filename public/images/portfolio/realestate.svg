      <stop offset="0%" stop-color="#2dd4bf" />
      <stop offset="100%" stop-color="#0f766e" />
    </linearGradient>
  </defs>

  <rect width="400" height="260" fill="url(#reBg)" />

  <circle cx="60" cy="200" r="90" fill="#ffffff" opacity="0.06" />

  <!-- house -->
