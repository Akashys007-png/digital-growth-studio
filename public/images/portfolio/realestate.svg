    <rect x="-64" y="-10" width="128" height="80" fill="#ffffff" />
    <rect x="-18" y="20" width="36" height="50" fill="#0f766e" />
    <rect x="-46" y="6" width="24" height="24" fill="#2dd4bf" />
    <rect x="22" y="6" width="24" height="24" fill="#2dd4bf" />
    <rect x="-8" y="-58" width="16" height="20" fill="#ffffff" />
  </g>

  <!-- sold sign -->
