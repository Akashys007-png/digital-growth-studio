    <rect x="-4" y="0" width="8" height="55" fill="#ffffff" />
    <rect x="-42" y="-38" width="76" height="34" rx="4" fill="#f59e0b" />
    <text x="-4" y="-16" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="800" fill="#ffffff" text-anchor="middle">SOLD</text>
  </g>
