<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGradPerf" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1f3a" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>
    <linearGradient id="boltGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#fb923c" />
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bgGradPerf)" />

  <circle cx="1040" cy="120" r="200" fill="#f59e0b" opacity="0.10" />
  <circle cx="120" cy="520" r="160" fill="#2457ff" opacity="0.10" />

  <!-- speed motion lines -->
  <g stroke="#ffffff" stroke-opacity="0.25" stroke-width="8" stroke-linecap="round">
    <line x1="160" y1="230" x2="320" y2="230" />
    <line x1="120" y1="270" x2="360" y2="270" />
    <line x1="180" y1="310" x2="300" y2="310" />
  </g>
  <g stroke="#ffffff" stroke-opacity="0.15" stroke-width="8" stroke-linecap="round">
    <line x1="880" y1="380" x2="1040" y2="380" />
    <line x1="860" y1="420" x2="1080" y2="420" />
  </g>

  <!-- central card -->
  <rect x="380" y="115" width="440" height="400" rx="28" fill="#ffffff" opacity="0.97" />

  <!-- gauge arc -->
  <g transform="translate(600,330)">
    <path d="M-140 20 A140 140 0 0 1 140 20" fill="none" stroke="#e2e8f0" stroke-width="18" stroke-linecap="round" />
    <path d="M-140 20 A140 140 0 0 1 90 -108" fill="none" stroke="url(#boltGrad)" stroke-width="18" stroke-linecap="round" />

    <!-- needle -->
    <line x1="0" y1="10" x2="86" y2="-70" stroke="#0b1f3a" stroke-width="8" stroke-linecap="round" />
    <circle cx="0" cy="10" r="16" fill="#0b1f3a" />

    <!-- tick labels -->
    <circle cx="-140" cy="20" r="5" fill="#94a3b8" />
    <circle cx="0" cy="-120" r="5" fill="#94a3b8" />
    <circle cx="140" cy="20" r="5" fill="#94a3b8" />
  </g>

  <!-- lightning bolt badge -->
  <g transform="translate(600,470)">
    <circle cx="0" cy="0" r="40" fill="url(#boltGrad)" />
    <path d="M4 -22 L-14 4 L-2 4 L-6 22 L16 -6 L4 -6 Z" fill="#ffffff" />
  </g>

  <!-- badge label -->
  <g transform="translate(500,155)">
    <rect x="0" y="0" width="200" height="34" rx="17" fill="#fff7ed" />
    <text x="100" y="23" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" fill="#c2410c" text-anchor="middle">PERFORMANCE</text>
  </g>

  <!-- Brand mark -->
  <g transform="translate(60,540)">
    <rect x="0" y="0" width="40" height="40" rx="10" fill="url(#boltGrad)" />
    <text x="20" y="26" font-family="Poppins, Arial, sans-serif" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">DGS</text>
    <text x="52" y="18" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" fill="#ffffff">Digital Growth Studio</text>
    <text x="52" y="34" font-family="Inter, Arial, sans-serif" font-size="12" fill="#fdba74">Performance</text>
  </g>
</svg>
